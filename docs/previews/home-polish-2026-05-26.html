<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=390, initial-scale=1" />
  <title>DON'T FOMO — Home polish preview</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #111;
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', system-ui, sans-serif;
    }
    .phone {
      width: 390px;
      height: 844px;
      border-radius: 44px;
      overflow: hidden;
      position: relative;
      box-shadow: 0 24px 80px rgba(0,0,0,0.55);
      background: linear-gradient(145deg, #1a0f2e 0%, #3d1f4a 45%, #8b3a5c 100%);
    }
    .blob {
      position: absolute;
      border-radius: 50%;
      filter: blur(60px);
      opacity: 0.45;
    }
    .blob1 { width: 220px; height: 220px; background: #7c5cff; top: -40px; left: -60px; }
    .blob2 { width: 180px; height: 180px; background: #d4537e; top: 120px; right: -40px; }
    .status {
      position: relative;
      z-index: 2;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 54px 24px 8px;
      color: #fff;
      font-size: 15px;
      font-weight: 600;
      font-variant-numeric: tabular-nums;
    }
    .widgets {
      position: relative;
      z-index: 2;
      display: flex;
      gap: 12px;
      padding: 8px 20px 0;
    }
    .widget {
      flex: 1;
      height: 150px;
      border-radius: 16px;
      padding: 16px;
      background: rgba(255,255,255,0.12);
      border: 1px solid rgba(255,255,255,0.18);
      backdrop-filter: blur(20px);
      display: flex;
      flex-direction: column;
    }
    .widget-top {
      display: flex;
      justify-content: space-between;
      font-size: 13px;
      font-weight: 600;
      color: #f2f3f7;
    }
    .widget-sub { opacity: 0.6; font-weight: 400; font-size: 11px; }
    .widget-value {
      margin-top: auto;
      font-size: 26px;
      font-weight: 700;
      letter-spacing: -0.5px;
      color: #fff;
      font-variant-numeric: tabular-nums;
    }
    .spark {
      margin: 8px 0 4px;
      height: 28px;
    }
    .flame-row {
      margin-top: auto;
      display: flex;
      align-items: center;
      gap: 5px;
      font-size: 11px;
      font-weight: 600;
      color: rgba(255,255,255,0.9);
    }
    .grid {
      position: relative;
      z-index: 2;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 20px 0;
      padding: 28px 20px 0;
    }
    .icon {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
    }
    .icon-tile {
      width: 60px;
      height: 60px;
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      color: #fff;
      position: relative;
    }
    .badge {
      position: absolute;
      top: -4px;
      right: -4px;
      min-width: 18px;
      height: 18px;
      border-radius: 9px;
      background: #ea3943;
      font-size: 11px;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 2px solid rgba(0,0,0,0.2);
    }
    .icon-label { font-size: 11px; color: rgba(255,255,255,0.92); font-weight: 500; }
    .dock {
      position: absolute;
      bottom: 72px;
      left: 12px;
      right: 12px;
      z-index: 2;
      display: flex;
      justify-content: space-around;
      padding: 14px 8px;
      border-radius: 28px;
      background: rgba(255,255,255,0.14);
      border: 1px solid rgba(255,255,255,0.2);
      backdrop-filter: blur(24px);
    }
    .home-bar {
      position: absolute;
      bottom: 12px;
      left: 50%;
      transform: translateX(-50%);
      width: 130px;
      height: 5px;
      border-radius: 3px;
      background: rgba(255,255,255,0.85);
      z-index: 3;
    }
    .caption {
      position: absolute;
      bottom: 28px;
      left: 0;
      right: 0;
      text-align: center;
      font-size: 10px;
      color: rgba(255,255,255,0.5);
      z-index: 4;
    }
  </style>
</head>
<body>
  <div class="phone">
    <div class="blob blob1"></div>
    <div class="blob blob2"></div>

    <div class="status">
      <span>9:41</span>
      <span>▮▮▮▮ ▂ ▃ ▄</span>
    </div>

    <div class="widgets">
      <div class="widget">
        <div class="widget-top">
          <span>Portfolio</span>
          <span class="widget-sub">Mon, May 26</span>
        </div>
        <div class="widget-value">$547.82</div>
        <svg class="spark" viewBox="0 0 140 28" width="100%" preserveAspectRatio="none">
          <polyline fill="none" stroke="#4ADE80" stroke-width="2.5" stroke-linecap="round"
            points="0,22 25,20 50,18 75,15 100,14 125,12 140,10" />
        </svg>
        <div class="widget-sub">+9.6% since Day 1</div>
      </div>
      <div class="widget">
        <div class="widget-top">
          <span>Clout</span>
          <span class="widget-sub">@kyleg</span>
        </div>
        <div class="widget-value">1,240</div>
        <div class="widget-sub">followers</div>
        <div class="flame-row">
          <span style="color:#F7A83A">🔥</span>
          <span>3-day streak · Day 4</span>
        </div>
      </div>
    </div>

    <div class="grid">
      <div class="icon"><div class="icon-tile" style="background:linear-gradient(135deg,#FB7185,#E11D48)">📰</div><span class="icon-label">News</span></div>
      <div class="icon"><div class="icon-tile" style="background:linear-gradient(135deg,#5AC8FA,#0A7FF0)"><span class="badge">2</span>✉️</div><span class="icon-label">Mail</span></div>
      <div class="icon"><div class="icon-tile" style="background:linear-gradient(135deg,#4ADE80,#16A34A)"><span class="badge">1</span>💬</div><span class="icon-label">Messages</span></div>
      <div class="icon"><div class="icon-tile" style="background:linear-gradient(135deg,#F472B6,#DB2777)">🛍</div><span class="icon-label">Market</span></div>
      <div class="icon"><div class="icon-tile" style="background:linear-gradient(135deg,#2DD4BF,#0D9488)">🏦</div><span class="icon-label">Bank</span></div>
      <div class="icon"><div class="icon-tile" style="background:linear-gradient(135deg,#A3E635,#65A30D)">💵</div><span class="icon-label">Cash Swipe</span></div>
      <div class="icon"><div class="icon-tile" style="background:linear-gradient(135deg,#94A3B8,#475569)"><span class="badge">1</span>📋</div><span class="icon-label">Clipboard</span></div>
      <div class="icon"><div class="icon-tile" style="background:linear-gradient(135deg,#9CA3AF,#4B5563)">⚙️</div><span class="icon-label">Settings</span></div>
    </div>

    <div class="dock">
      <div class="icon"><div class="icon-tile" style="width:52px;height:52px;background:linear-gradient(135deg,#48484A,#1C1C1E)">✕</div></div>
      <div class="icon"><div class="icon-tile" style="width:52px;height:52px;background:linear-gradient(135deg,#4F7CF6,#2540C8)">📊</div></div>
      <div class="icon"><div class="icon-tile" style="width:52px;height:52px;background:linear-gradient(135deg,#FBB24A,#EA580C)">👛</div></div>
      <div class="icon"><div class="icon-tile" style="width:52px;height:52px;background:linear-gradient(135deg,#3EC6F5,#1597D6)">✈️</div></div>
    </div>
    <div class="home-bar"></div>
  </div>
</body>
</html>
